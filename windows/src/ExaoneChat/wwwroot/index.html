<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; style-src-attr 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="shared/theme-init.js"></script>
  <title>EXAONE</title>
  <link rel="icon" href="shared/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="shared/vendor/katex.min.css">
  <link rel="stylesheet" href="shared/render.css">
  <link rel="stylesheet" href="shared/theme.css">
  <script defer src="shared/vendor/marked.min.js"></script>
  <script defer src="shared/vendor/purify.min.js"></script>
  <script defer src="shared/vendor/highlight.min.js"></script>
  <script defer src="shared/vendor/katex.min.js"></script>
  <script defer src="shared/search.js"></script>
  <script defer src="shared/search-settings.js"></script>
  <script defer src="shared/render.js"></script>
  <script defer src="shared/chat.js"></script>
  <script defer src="shared/session.js"></script>
  <script defer src="keys.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <button id="sidebarShade" class="sidebar-shade" aria-label="목록 닫기" hidden></button>
  <aside id="sidebar" class="sidebar" aria-label="대화 목록">
    <div class="brand">EXAONE</div>
    <div class="sidebar-actions"><button id="newChat" class="outline" title="새 대화 (Ctrl+N)">새 대화<span class="shortcut" aria-hidden="true">Ctrl N</span></button></div>
    <div class="conversation-search"><input id="conversationSearch" type="search" placeholder="대화 검색" aria-label="대화 검색" autocomplete="off"></div>
    <nav id="conversationList" class="conversation-list" aria-label="저장된 대화"></nav>
    <footer class="sidebar-footer"><button id="openSettings">설정</button><span id="keyStatus" class="status"><i></i><span>키 없음</span></span></footer>
  </aside>
  <main>
    <header class="topbar">
      <button id="toggleList" aria-expanded="false" aria-controls="sidebar">목록</button>
      <h1 id="chatTitle">새 대화</h1>
      <div class="model-status"><span id="modelLabel"></span></div>
      <button id="exportChat" type="button" disabled>내보내기</button>
    </header>
    <div id="appError" class="app-error" role="alert" hidden></div>
    <div id="messageScroll" class="message-scroll">
      <section id="emptyState" class="empty-state">
        <div class="empty-content"><h2 id="welcomeTitle">무엇이든<br>물어보세요.</h2><p id="welcomeText">질문, 글, 코드. 무엇이든 EXAONE에게.</p><button id="welcomeSettings" class="primary" hidden>설정 열기</button></div>
      </section>
      <section id="messages" class="messages" aria-label="메시지" hidden></section>
    </div>
    <p id="generationLimit" class="generation-limit" role="status" hidden></p>
    <div class="jump-wrap"><button id="jumpBottom" class="jump-bottom" type="button" hidden>맨 아래로</button></div>
    <div class="composer-wrap">
      <form id="composer" class="composer">
        <textarea id="messageInput" rows="1" placeholder="메시지를 입력하세요" aria-label="메시지" maxlength="200000"></textarea>
        <div class="composer-bottom"><div class="composer-left"><div id="reasoningChoice" class="generation-choice"><span class="generation-label">추론</span><div class="generation-options" role="group" aria-label="추론 강도"><button type="button" data-effort="low" aria-pressed="false">낮음</button><button type="button" data-effort="high" aria-pressed="false">높음</button><button type="button" data-effort="max" aria-pressed="true">최대</button></div></div><div id="thinkingChoice" class="generation-choice" hidden><span class="generation-label">생각</span><div class="generation-options" role="group" aria-label="생각 모드"><button type="button" data-thinking="false" aria-pressed="false">끔</button><button type="button" data-thinking="true" aria-pressed="true">켬</button></div></div><div id="searchChoice" class="generation-choice"><span class="generation-label">검색</span><div class="generation-options" role="group" aria-label="웹 검색"><button type="button" data-search="false" aria-pressed="true">끔</button><button type="button" data-search="true" aria-pressed="false">켬</button></div></div><button id="searchSettingsLink" class="search-settings-link" type="button" hidden>설정</button><span id="streamStatus" class="status" aria-live="polite"></span></div><button id="sendButton" class="primary" type="submit">보내기</button></div>
      </form>
      <p class="input-hint">Enter 보내기 · Shift+Enter 줄바꿈</p>
    </div>
  </main>
  <div id="settingsOverlay" class="settings-overlay" hidden>
    <button id="settingsShade" class="settings-shade" aria-label="설정 닫기"></button>
    <section id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
      <header class="settings-header"><h2 id="settingsTitle">설정</h2><button id="closeSettings">닫기</button></header>
      <form id="settingsForm">
        <div class="settings-fields">
          <section class="settings-section"><h3>연결</h3>
            <div id="apiKeys" class="key-list" aria-label="API 키 목록"></div>
            <div id="keyAdd" class="field key-add"><label for="apiKey">키 추가</label><input id="apiKey" type="password" placeholder="API 키 입력" autocomplete="off" spellcheck="false" maxlength="8192"><div class="key-add-bottom"><input id="newKeyLabel" aria-label="새 키 라벨" placeholder="라벨 (선택)" maxlength="30"><button id="addKey" class="outline" type="button">추가</button></div><p id="keyNote" class="field-note">추가 전에 연결을 확인합니다.</p></div><div id="keyResult" class="key-result" role="status"></div><button id="deleteKey" type="button" hidden>키 삭제</button>
            <div class="field"><label for="baseUrl">Base URL</label><input id="baseUrl" type="url" list="baseUrlOptions" required spellcheck="false"><datalist id="baseUrlOptions"><option value="https://api.exaone.ai/v1"></option><option value="https://api.friendli.ai/serverless/v1"></option></datalist></div>
            <div class="field"><label for="model">모델</label><input id="model" list="modelOptions" required spellcheck="false"><datalist id="modelOptions"><option value="k-exaone_v2.5"></option><option value="LGAI-EXAONE/K-EXAONE-2.0-750B-A37B"></option><option value="LGAI-EXAONE/K-EXAONE-236B-A23B"></option><option value="LGAI-EXAONE/EXAONE-4.0.1-32B"></option></datalist></div>
            <button id="checkConnection" class="outline" type="button">연결 확인</button>
            <div id="connectionResult" class="connection-result" role="status"></div>
          </section>
          <section id="searchSettings" class="settings-section"><h3>검색</h3>
            <div class="field"><span class="field-caption">제공자</span><div class="provider-options generation-options" role="group" aria-label="검색 제공자"><button type="button" data-provider="auto" aria-pressed="true">자동</button><button type="button" data-provider="searxng" aria-pressed="false">SearXNG</button><button type="button" data-provider="tavily" aria-pressed="false">Tavily</button><button type="button" data-provider="brave" aria-pressed="false">Brave</button></div></div>
            <div class="field"><label for="searxngUrl">SearXNG 주소</label><input id="searxngUrl" type="url" spellcheck="false" maxlength="2048"></div>
            <div class="field"><div class="field-label"><label for="tavilyKey">Tavily 키</label><button id="deletetavilyKey" type="button">키 삭제</button></div><input id="tavilyKey" type="password" autocomplete="off" spellcheck="false" maxlength="8192"><p class="field-note"><a href="https://tavily.com" target="_blank" rel="noopener noreferrer">Tavily에서 키 발급</a></p></div>
            <div class="field"><div class="field-label"><label for="braveKey">Brave 키</label><button id="deletebraveKey" type="button">키 삭제</button></div><input id="braveKey" type="password" autocomplete="off" spellcheck="false" maxlength="8192"><p class="field-note"><a href="https://brave.com/search/api/" target="_blank" rel="noopener noreferrer">Brave에서 키 발급</a></p></div>
            <button id="checkSearch" class="outline" type="button">검색 확인</button><div id="searchResult" class="connection-result" role="status"></div>
          </section>
          <section class="settings-section"><h3>화면</h3><div class="theme-options generation-options" role="group" aria-label="화면 모드"><button type="button" data-theme-choice="light">라이트</button><button type="button" data-theme-choice="dark">다크</button><button type="button" data-theme-choice="system">시스템</button></div></section>
          <section class="settings-section"><h3>응답</h3>
            <div class="field"><label for="temperature">Temperature</label><div class="range-row"><input id="temperatureRange" aria-label="Temperature 슬라이더" type="range" min="0" max="2" step="0.05"><input id="temperature" type="number" min="0" max="2" step="0.05" required></div></div>
            <div class="field"><label for="topP">Top P</label><div class="range-row"><input id="topPRange" aria-label="Top P 슬라이더" type="range" min="0.01" max="1" step="0.01"><input id="topP" type="number" min="0.01" max="1" step="0.01" required></div></div>
            <div class="field"><label for="maxTokens">최대 토큰</label><input id="maxTokens" type="number" min="1" max="1048576" step="1" required></div>
            <div class="field"><label for="systemPrompt">시스템 프롬프트</label><textarea id="systemPrompt" rows="4" placeholder="응답 방식이나 역할을 지정하세요"></textarea></div>
          </section>
        </div>
        <footer class="settings-footer"><div><button id="saveSettings" class="primary" type="submit">저장</button><button id="cancelSettings" type="button">취소</button></div><p id="saveResult" role="status"></p></footer>
      </form>
    </section>
  </div>
</body>
</html>
